<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทำข้อสอบพยาธิวิทยา (100 ข้อ)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --accent: #0f172a;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%);
            color: white;
            padding: 35px 20px 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: #bae6fd;
        }

        .container {
            max-width: 920px;
            margin: -15px auto 0;
            padding: 0 15px;
        }

        .dashboard-sticky {
            position: sticky;
            top: 15px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            margin-bottom: 20px;
        }

        .stat-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-value.score { color: var(--success); }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #0284c7, #10b981);
            width: 0%;
            transition: width 0.3s ease;
        }

        .chapter-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 5px 0 15px;
            scrollbar-width: none;
        }
        .chapter-filter::-webkit-scrollbar { display: none; }

        .filter-btn {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            font-weight: 600;
        }

        .question-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .chapter-badge {
            font-size: 11px;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 3px 8px;
            border-radius: 5px;
        }

        .q-index {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .q-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        @media (min-width: 640px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            background: #f8fafc;
            border: 1.5px solid var(--border);
            padding: 10px 14px;
            border-radius: 8px;
            text-align: left;
            font-size: 13.5px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-btn.correct {
            background: var(--success-light) !important;
            border-color: var(--success) !important;
            color: #065f46 !important;
            font-weight: 600;
        }

        .option-btn.wrong {
            background: var(--danger-light) !important;
            border-color: var(--danger) !important;
            color: #991b1b !important;
        }

        .explanation-box {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: 6px;
            border-left: 4px solid var(--primary);
            font-size: 13px;
            color: #334155;
            line-height: 1.5;
        }

        .explanation-box.show {
            display: block;
        }

        .summary-wrapper {
            display: none;
            background: var(--card);
            padding: 30px 20px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-top: 25px;
            border: 1px solid var(--border);
        }

        .summary-score {
            font-size: 40px;
            font-weight: 800;
            color: var(--primary);
            margin: 10px 0;
        }

        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .action-btn:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Pathology Practice Examination (100 ข้อ)</h1>
    <p>อิงตามแนวข้อสอบ 60 ข้อแรก และเพิ่มข้อสอบตามสไลด์เรียนครบ 100 ข้อ</p>
</div>

<div class="container">
    <div class="dashboard-sticky">
        <div class="stat-group">
            <div class="stat-item">
                <span class="stat-label">ทำแล้ว</span>
                <span class="stat-value"><span id="ans-count">0</span> / 100</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">คะแนนรวม</span>
                <span class="stat-value score" id="score-count">0</span>
            </div>
        </div>
        <div style="flex: 1; min-width: 150px;">
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <div class="chapter-filter">
        <button class="filter-btn active" onclick="filterChapter('all', this)">ทั้งหมด (100 ข้อ)</button>
        <button class="filter-btn" onclick="filterChapter('core', this)">แนวข้อสอบหลัก (ข้อ 1-60)</button>
        <button class="filter-btn" onclick="filterChapter('ch1', this)">1. บทนำและเทคนิคพยาธิวิทยา</button>
        <button class="filter-btn" onclick="filterChapter('ch2', this)">2. การอักเสบ (Inflammation)</button>
        <button class="filter-btn" onclick="filterChapter('ch3', this)">3. Hemodynamics</button>
        <button class="filter-btn" onclick="filterChapter('ch4', this)">4. Cell Injury & Death</button>
        <button class="filter-btn" onclick="filterChapter('ch5', this)">5. Neoplasia & มะเร็ง</button>
        <button class="filter-btn" onclick="filterChapter('ch6', this)">6. สิ่งแวดล้อมและโภชนาการ</button>
        <button class="filter-btn" onclick="filterChapter('ch7', this)">7. ภูมิคุ้มกัน & โรคติดเชื้อ</button>
    </div>

    <div id="questions-list"></div>

    <button class="action-btn" id="finish-btn" style="width: 100%;" onclick="submitExam()">ส่งข้อสอบและสรุปผลคะแนนทั้งหมด</button>

    <div id="summary-card" class="summary-wrapper">
        <h2>🎉 สรุปผลการทดสอบ</h2>
        <div class="summary-score" id="score-percent">0 / 100</div>
        <p id="feedback-text" style="color: var(--text-sub); margin-bottom: 15px;"></p>
        <button class="action-btn" onclick="location.reload()">ทำแบบทดสอบใหม่อีกครั้ง</button>
    </div>
</div>

let userResponses = new Array(examDatabase.length).fill(null);
let totalScore = 0;
let currentFilter = 'all';

function renderQuestions() {
    const listContainer = document.getElementById('questions-list');
    listContainer.innerHTML = '';

    examDatabase.forEach((item, index) => {
        let isHidden = false;
        if (currentFilter === 'core') {
            isHidden = (item.group !== 'core');
        } else if (currentFilter !== 'all') {
            isHidden = (item.ch !== currentFilter);
        }

        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${index}`;
        if (isHidden) card.style.display = 'none';

        const header = document.createElement('div');
        header.className = 'card-header';
        header.innerHTML = `
            <span class="chapter-badge">${item.chName}</span>
            <span class="q-index">ข้อที่ ${index + 1} / 100</span>
        `;

        const title = document.createElement('div');
        title.className = 'q-title';
        title.innerText = item.q;

        const grid = document.createElement('div');
        grid.className = 'options-grid';

        item.options.forEach((optText, optIdx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.id = `btn-${index}-${optIdx}`;
            btn.innerText = `${String.fromCharCode(65 + optIdx)}. ${optText}`;
            btn.onclick = () => handleSelection(index, optIdx);

            if (userResponses[index] !== null) {
                btn.disabled = true;
                if (optIdx === item.ans) btn.classList.add('correct');
                else if (optIdx === userResponses[index]) btn.classList.add('wrong');
            }

            grid.appendChild(btn);
        });

        const exp = document.createElement('div');
        exp.className = `explanation-box ${userResponses[index] !== null ? 'show' : ''}`;
        exp.id = `exp-${index}`;
        exp.innerHTML = `<strong>💡 คำอธิบายเฉลย:</strong> ${item.exp}`;

        card.appendChild(header);
        card.appendChild(title);
        card.appendChild(grid);
        card.appendChild(exp);

        listContainer.appendChild(card);
    });
}

function handleSelection(qIdx, selectedOpt) {
    if (userResponses[qIdx] !== null) return;

    userResponses[qIdx] = selectedOpt;
    const qData = examDatabase[qIdx];
    const isCorrect = (selectedOpt === qData.ans);

    if (isCorrect) totalScore++;

    for (let i = 0; i < qData.options.length; i++) {
        const btn = document.getElementById(`btn-${qIdx}-${i}`);
        btn.disabled = true;
        if (i === qData.ans) {
            btn.classList.add('correct');
        } else if (i === selectedOpt && !isCorrect) {
            btn.classList.add('wrong');
        }
    }

    document.getElementById(`exp-${qIdx}`).classList.add('show');
    refreshStats();
}

function refreshStats() {
    const answeredCount = userResponses.filter(r => r !== null).length;
    document.getElementById('ans-count').innerText = answeredCount;
    document.getElementById('score-count').innerText = totalScore;
    document.getElementById('progress-fill').style.width = `${(answeredCount / examDatabase.length) * 100}%`;
}

function filterChapter(chKey, btnElement) {
    currentFilter = chKey;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');

    examDatabase.forEach((item, index) => {
        const card = document.getElementById(`card-${index}`);
        let show = false;
        if (chKey === 'all') {
            show = true;
        } else if (chKey === 'core') {
            show = (item.group === 'core');
        } else {
            show = (item.ch === chKey);
        }
        card.style.display = show ? 'block' : 'none';
    });
}

function submitExam() {
    const answered = userResponses.filter(r => r !== null).length;
    if (answered < examDatabase.length) {
        if (!confirm(`คุณทำข้อสอบไปแล้ว ${answered}/100 ข้อ ต้องการส่งข้อสอบและตรวจผลเลยหรือไม่?`)) {
            return;
        }
    }

    document.getElementById('finish-btn').style.display = 'none';
    const summary = document.getElementById('summary-card');
    summary.style.display = 'block';

    document.getElementById('score-percent').innerText = `${totalScore} / 100 คะแนน`;

    let feedback = "";
    const pct = (totalScore / examDatabase.length) * 100;
    if (pct >= 80) feedback = "ยอดเยี่ยมมากครับ! คุณมีความรู้ความเข้าใจในวิชาพยาธิวิทยาเป็นอย่างดี พร้อมลุยสอบจริงแล้วครับ";
    else if (pct >= 60) feedback = "ผ่านเกณฑ์ระดับดีครับ! ลองกดทบทวนข้อที่ตอบผิดอีกรอบเพื่อความแม่นยำเต็มที่ครับ";
    else feedback = "แนะนำให้กลับไปทบทวนสไลด์ตามหัวข้อที่ตอบผิด แล้วลองทำใหม่อีกครั้งนะครับ สู้ๆ ครับ!";

    document.getElementById('feedback-text').innerText = feedback;
    summary.scrollIntoView({ behavior: 'smooth' });
}

window.onload = () => {
    renderQuestions();
    refreshStats();
};
