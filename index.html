<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบทำข้อสอบพยาธิวิทยา (Pathology Exam Platform)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --accent: #0f172a;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%);
            color: white;
            padding: 35px 20px 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: #bae6fd;
        }

        .container {
            max-width: 900px;
            margin: -15px auto 0;
            padding: 0 15px;
        }

        /* Selector Bar */
        .set-selector-bar {
            background: white;
            padding: 12px;
            border-radius: var(--radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .set-btn {
            background: var(--bg);
            border: 1.5px solid var(--border);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
            flex: 1;
            text-align: center;
        }

        .set-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
        }

        /* Sticky Stats */
        .dashboard-sticky {
            position: sticky;
            top: 15px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            margin-bottom: 20px;
        }

        .stat-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-value.score { color: var(--success); }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #0284c7, #10b981);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .chapter-badge {
            font-size: 11px;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 3px 8px;
            border-radius: 5px;
        }

        .q-index {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .q-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        @media (min-width: 640px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            background: #f8fafc;
            border: 1.5px solid var(--border);
            padding: 10px 14px;
            border-radius: 8px;
            text-align: left;
            font-size: 13.5px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-btn.correct {
            background: var(--success-light) !important;
            border-color: var(--success) !important;
            color: #065f46 !important;
            font-weight: 600;
        }

        .option-btn.wrong {
            background: var(--danger-light) !important;
            border-color: var(--danger) !important;
            color: #991b1b !important;
        }

        .explanation-box {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: 6px;
            border-left: 4px solid var(--primary);
            font-size: 13px;
            color: #334155;
            line-height: 1.5;
        }

        .explanation-box.show {
            display: block;
        }

        .summary-wrapper {
            display: none;
            background: var(--card);
            padding: 35px 25px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-top: 25px;
            border: 1px solid var(--border);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .summary-box {
            padding: 15px;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid var(--border);
        }

        .summary-box.correct { border-color: var(--success); color: var(--success); }
        .summary-box.wrong { border-color: var(--danger); color: var(--danger); }
        .summary-box.total { border-color: var(--primary); color: var(--primary); }

        .summary-box .val {
            font-size: 26px;
            font-weight: 800;
            margin-top: 5px;
        }

        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
        }

        .action-btn:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Pathology Practice Examination</h1>
    <p>ระบบสุ่มสลับตัวเลือกอัตโนมัติทุกครั้งที่เริ่มทำใหม่ | แยกวิเคราะห์ผลคะแนนรายชุด</p>
</div>

<div class="container">
    <!-- Set Selection Tabs -->
    <div class="set-selector-bar">
        <button class="set-btn active" id="btn-set-2" onclick="switchSet('set2')">⭐ ชุดที่ 2: เจาะตามแนวข้อสอบจริง (60 ข้อ)</button>
        <button class="set-btn" id="btn-set-1" onclick="switchSet('set1')">ชุดที่ 1: คลังข้อสอบตามบทเรียน (100 ข้อ)</button>
    </div>

    <!-- Sticky Stats -->
    <div class="dashboard-sticky">
        <div class="stat-group">
            <div class="stat-item">
                <span class="stat-label">ทำแล้ว</span>
                <span class="stat-value"><span id="ans-count">0</span> / <span id="total-q-count">60</span></span>
            </div>
            <div class="stat-item">
                <span class="stat-label">คะแนนปัจจุบัน</span>
                <span class="stat-value score" id="score-count">0</span>
            </div>
        </div>
        <div style="flex: 1; min-width: 150px;">
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- Question Container -->
    <div id="questions-list"></div>

    <button class="action-btn" id="finish-btn" style="width: 100%;" onclick="submitExam()">ส่งข้อสอบและสรุปผลคะแนน</button>

    <!-- Summary Box -->
    <div id="summary-card" class="summary-wrapper">
        <h2 id="summary-title">🎉 สรุปผลการทดสอบ</h2>
        
        <div class="summary-grid">
            <div class="summary-box correct">
                <div>ตอบถูก</div>
                <div class="val" id="sum-correct">0</div>
            </div>
            <div class="summary-box wrong">
                <div>ตอบผิด</div>
                <div class="val" id="sum-wrong">0</div>
            </div>
            <div class="summary-box total">
                <div>คะแนนรวม</div>
                <div class="val" id="sum-total">0%</div>
            </div>
        </div>

        <p id="feedback-text" style="color: var(--text-sub); margin-bottom: 15px; font-size: 14px;"></p>
        <button class="action-btn" onclick="restartCurrentSet()">สลับช้อยส์ & ทำชุดนี้ใหม่อีกครั้ง</button>
    </div>
</div>

<script>
// ==========================================
// 1. ฐานข้อมูลชุดที่ 2 (เจาะตรงแนว 60 ข้อเป๊ะ)
// ==========================================
const rawSet2 = [
    { chName: "บทนำพยาธิวิทยา", q: "1. ข้อใดจับคู่คำจำกัดความพื้นฐานทางพยาธิวิทยาได้ถูกต้อง", options: ["Pathology - ศึกษาการทำงานตามปกติของร่างกาย", "Etiology - ศึกษาสาเหตุของการเกิดโรคหรือการบาดเจ็บ", "Pathogenesis - ศึกษาการเปลี่ยนแปลงโครงสร้างด้วยตาเปล่า", "Homeostasis - ภาวะที่เซลล์ไม่สามารถปรับตัวได้จนเกิดเนื้อตาย"], correctIndex: 1, exp: "Etiology คือการศึกษาสาเหตุของโรค ส่วน Pathology คือการศึกษาความผิดปกติของโครงสร้างเซลล์/เนื้อเยื่อ, Pathogenesis คือกลไกการเกิดโรคทีละขั้นตอน และ Homeostasis คือภาวะธำรงดุล" },
    { chName: "บทนำพยาธิวิทยา", q: "2. ผู้ป่วยโรคตับแข็ง (Liver cirrhosis) หากนำชิ้นเนื้อตับไปย้อมพิเศษเพื่อดูพังผืด (Fibrosis) ต้องใช้สีใดและให้ผลอย่างไร", options: ["ย้อม Prussian Blue ได้ผลเป็นตะกอนสีน้ำเงินของไขมัน", "ย้อม Masson's Trichrome พบเนื้อเยื่อพังผืด (Fibrous septa) ติดสีน้ำเงิน ล้อมรอบ Regenerative nodules", "ย้อม Oil Red O พบพังผืดติดสีชมพูใส", "ย้อม Hematoxylin อย่างเดียวพบเซลล์ตับติดสีเขียว"], correctIndex: 1, exp: "Masson's Trichrome เป็นสีพิเศษที่ย้อมคอลลาเจน/พังผืดติดสีน้ำเงิน ซึ่งจะเห็นเป็นแถบ Fibrous septa สีน้ำเงินคั่นรอบก้อนเซลล์ตับ (Nodules) สีแดงอย่างชัดเจนในตับแข็ง" },
    { chName: "บทนำพยาธิวิทยา", q: "3. ในการเตรียมชิ้นเนื้อเพื่อฝังในพาราฟินบล็อก (Tissue processing) มีลำดับขั้นตอนที่ถูกต้องตามข้อใด", options: ["Fixation → Clearing → Dehydration → Infiltration → Embedding", "Fixation → Dehydration → Clearing → Infiltration → Embedding", "Embedding → Sectioning → Clearing → Staining → Mounting", "Dehydration → Fixation → Infiltration → Clearing → Sectioning"], correctIndex: 1, exp: "ลำดับการเตรียมชิ้นเนื้อมาตรฐานคือ: 1. Fixation (คงสภาพ) → 2. Dehydration (ไล่น้ำด้วยแอลกอฮอล์) → 3. Clearing (ทำให้ใสด้วยไซลีน) → 4. Infiltration (แทรกซึมพาราฟิน 52-60°C) → 5. Embedding (หล่อบล็อก)" },
    { chName: "บทนำพยาธิวิทยา", q: "4. ขั้นตอนการตัดชิ้นเนื้อ (Sectioning) เพื่อนำไปย้อมสีสไลด์ถาวร นิยมตัดด้วยเครื่องมือใดและมีความหนาเท่าใด", options: ["ตัดด้วยมีดผ่าตัด ความหนา 1-2 มิลลิเมตร", "ตัดด้วยเครื่อง Microtome ความหนาประมาณ 3-5 ไมโครเมตร", "ตัดด้วยเครื่อง Cryostat ความหนา 50 ไมโครเมตร", "ตัดด้วยเครื่องเลเซอร์ ความหนา 100 ไมโครเมตร"], correctIndex: 1, exp: "การตัดชิ้นเนื้อมาตรฐานทางพยาธิวิทยาใช้เครื่อง Rotary Microtome ตัดชิ้นเนื้อที่ฝังในพาราฟินบล็อกให้มีความหนา 3-5 ไมโครเมตร" },
    { chName: "บทนำพยาธิวิทยา", q: "5. ข้อใดกล่าวถึงการตรวจชิ้นเนื้อด้วยเทคนิคแช่แข็งด่วน (Frozen section) ได้ถูกต้อง", options: ["ต้องนำชิ้นเนื้อไปแช่ฟอร์มาลิน 24 ชั่วโมงก่อนตัด", "เป็นการเตรียมชิ้นเนื้ออย่างรวดเร็วเพื่อการวินิจฉัยระหว่างการผ่าตัด (Intraoperative consultation)", "ต้องฝังชิ้นเนื้อในพาราฟินเหลวที่อุณหภูมิ 60°C", "ไม่สามารถใช้เครื่องตรวจดูเซลล์ได้"], correctIndex: 1, exp: "Frozen section ทำโดยนำชิ้นเนื้อสดมาแช่แข็งในเครื่อง Cryostat เพื่อตัดและย้อมสีทันที ช่วยให้ศัลยแพทย์ทราบผลการวินิจฉัยขณะผู้ป่วยยังอยู่ในห้องผ่าตัด" },
    { chName: "บทนำพยาธิวิทยา", q: "6. การตรวจโปรตีนหรือแอนติเจนที่จำเพาะ เช่น PSA ในเนื้อเยื่อต่อมลูกหมาก อาศัยเทคนิคในข้อใด", options: ["Immunohistochemistry (IHC) โดยอาศัยแอนติบอดีจับจำเพาะกับแอนติเจน", "Masson's Trichrome staining", "Acid-fast bacilli staining", "Oil Red O staining"], correctIndex: 0, exp: "Immunohistochemistry (IHC) เป็นเทคนิคที่ใช้แอนติบอดีจำเพาะเข้าจับกับโปรตีนเป้าหมาย เช่น PSA เพื่อตรวจหาการแสดงออกของเซลล์ในต่อมลูกหมาก" },
    { chName: "บทนำพยาธิวิทยา", q: "7. ผู้ป่วยมีอาการกล้ามเนื้ออ่อนแรงจากโรค Myasthenia gravis มีพยาธิกำเนิดระดับโมเลกุลเกิดจากอะไร", options: ["การสร้าง Autoantibody ไปขัดขวางและทำลาย Acetylcholine receptor ที่รอยต่อประสาทและกล้ามเนื้อ", "ขาดเอนไซม์ย่อยไขมันในเซลล์กล้ามเนื้อ", "การสะสมของคราบเคราตินในหลอดเลือด", "เซลล์กล้ามเนื้อหัวใจฝ่อลีบจากพันธุกรรม"], correctIndex: 0, exp: "Myasthenia gravis เกิดจากระบบภูมิคุ้มกันสร้าง Autoantibodies ต่อ Acetylcholine receptors บริเวณ Neuromuscular junction ส่งผลให้การส่งสัญญาณประสาทล้มเหลวและกล้ามเนื้ออ่อนแรง" },
    { chName: "บทนำพยาธิวิทยา", q: "8. ผู้ป่วยมีไข้ ปวดศีรษะ สงสัยติดเชื้อในระบบประสาท ย้อมสารเรืองแสงพบแสงสีเขียวสว่างใต้กล้องฟลูออเรสเซนส์ เทคนิคนี้คือข้อใด", options: ["Immunofluorescence (IFA) โดยใช้สารเรืองแสง FITC ติดฉลากบนแอนติบอดี", "การย้อมสี Hematoxylin and Eosin", "การทำ Laser Ablation ICP-MS", "การตรวจนับเม็ดเลือดสมบูรณ์ (CBC)"], correctIndex: 0, exp: "Immunofluorescence (IFA) ใช้แอนติบอดีติดฉลากสารเรืองแสง FITC ซึ่งจะเปล่งแสงสีเขียวสว่างเมื่อจับกับเชื้อก่อโรค เช่น ในการตรวจไวรัสพิษสุนัขบ้า (RFFIT)" },
    { chName: "ภูมิคุ้มกัน & โรคติดเชื้อ", q: "9. ทฤษฎีภูมิคุ้มกัน: Innate immunity แตกต่างจาก Adaptive immunity ในข้อใด", options: ["Innate immunity ตอบสนองช้าและมีความจำจำเพาะ", "Innate immunity ตอบสนองทันที ไม่จำเพาะ และไม่มีหน่วยความจำ ส่วน Adaptive มีความจำเพาะและอาศัย T/B cells", "Adaptive immunity ประกอบด้วยเซลล์ Neutrophil และด่านผิวหนังเท่านั้น", "Innate immunity ต้องอาศัยการสร้างแอนติบอดีเสมอ"], correctIndex: 1, exp: "Innate immunity คือภูมิคุ้มกันด่านแรก ตอบสนองรวดเร็ว ไม่จำเพาะเจาะจง ส่วน Adaptive immunity มีความจำเพาะสูง สร้างหน่วยความจำ และอาศัยการทำงานของ T และ B lymphocytes" },
    { chName: "บทนำพยาธิวิทยา", q: "10. ผู้ป่วยโรคอ้วนและดื่มสุราเป็นประจำ สงสัยภาวะไขมันสะสมในเซลล์ตับ (Steatosis) ควรย้อมชิ้นเนื้อแช่แข็งด้วยวิธีใด", options: ["ย้อม Prussian Blue ได้สีน้ำเงิน", "ย้อม Oil Red O (ORO) ตรวจพบหยดไขมันติดสีแดงสดภายในเซลล์", "ย้อม Gram stain ได้สีม่วง", "ย้อม Pap smear"], correctIndex: 1, exp: "Oil Red O ละลายได้ดีในไขมัน จึงใช้ย้อมหยดไขมัน (Triglycerides/Lipids) ในเซลล์ตับจากชิ้นเนื้อสดหรือแช่แข็งให้เห็นเป็นสีแดงสด" },
    { chName: "บทนำพยาธิวิทยา", q: "11. การตรวจชิ้นเนื้อก้อนมะเร็งเต้านมเพื่อหาโปรตีน HER2 เพื่อวางแผนการรักษา นิยมใช้เทคนิคใด", options: ["Masson's Trichrome", "Immunohistochemistry (IHC)", "Acid Fast Stain", "CBC Analysis"], correctIndex: 1, exp: "Immunohistochemistry (IHC) เป็นวิธีมาตรฐานที่ใช้ตรวจวัดระดับการแสดงออกของโปรตีน HER2 receptor บนผิวเซลล์มะเร็งเต้านม" },
    { chName: "สิ่งแวดล้อมและโภชนาการ", q: "12. ผู้ป่วยสูบบุหรี่จัดมานาน เยื่อบุหลอดลมเปลี่ยนจาก Pseudostratified ciliated columnar เป็น Stratified squamous จัดเป็นพยาธิสภาพใด", options: ["Dysplasia", "Squamous metaplasia", "Hypertrophy", "Atrophy"], correctIndex: 1, exp: "Squamous metaplasia ในหลอดลมของผู้สูบบุหรี่เป็นการปรับเปลี่ยนชนิดของเซลล์เยื่อบุผิวเพื่อให้ทนทานต่อสารระคายเคืองในควันบุหรี่ได้ดียิ่งขึ้น" },
    { chName: "Cell Injury & Death", q: "13. ข้อใดจัดเป็นการบาดเจ็บของเซลล์ที่ 'สามารถกลับคืนสู่ภาวะปกติได้' (Reversible cell injury)", options: ["การเกิดพังผืด (Fibrosis) และตับแข็ง", "เซลล์บวมน้ำ (Cellular swelling) และการสะสมไขมัน (Fatty change)", "การละลายนิวเคลียส (Karyolysis)", "การแตกสลายของเยื่อหุ้มเซลล์ในเนื้อตาย"], correctIndex: 1, exp: "Cellular swelling (จากการทำงานของ Na/K pump ลดลงชั่วคราว) และ Fatty change จัดเป็นการบาดเจ็บระยะแรกที่สามารถฟื้นตัวกลับมาเป็นปกติได้หากหมดสิ่งกระตุ้น" },
    { chName: "Cell Injury & Death", q: "14. การปรับตัวของเซลล์ (Cellular adaptation) โดยการ 'เพิ่มขนาดของเซลล์' ส่งผลให้อวัยวะโตขึ้น เรียกว่าอะไร", options: ["Hyperplasia", "Hypertrophy", "Atrophy", "Metaplasia"], correctIndex: 1, exp: "Hypertrophy คือการเพิ่ม 'ขนาด' ของเซลล์ เช่น กล้ามเนื้อหัวใจหนาตัวขึ้นในคนเป็นความดันโลหิตสูง" },
    { chName: "Cell Injury & Death", q: "15. การปรับตัวของเซลล์ในข้อใดที่ส่งผลให้ 'จำนวนของเซลล์เพิ่มขึ้น' (Increased cell number)", options: ["Hypertrophy", "Hyperplasia", "Atrophy", "Dysplasia"], correctIndex: 1, exp: "Hyperplasia คือการเพิ่ม 'จำนวน' เซลล์ เช่น การหนาตัวของเยื่อบุโพรงมดลูกจากการกระตุ้นของฮอร์โมน" },
    { chName: "Cell Injury & Death", q: "16. หลังผู้ป่วยถูกตัดไตออกไปหนึ่งข้าง ไตข้างที่เหลือจะขยายขนาดขึ้นเพื่อทำหน้าที่ชดเชย จัดเป็นการปรับตัวแบบใด", options: ["Compensatory hyperplasia และ hypertrophy", "Pathologic atrophy", "Dysplasia", "Squamous metaplasia"], correctIndex: 0, exp: "ไตข้างที่เหลือจะเกิดการปรับตัวแบบขยายขนาดและเพิ่มสมรรถภาพการทำงานชดเชย (Compensatory adaptation)" },
    { chName: "Cell Injury & Death", q: "17. ภาวะที่สมองของผู้สูงอายุมีขนาดเล็กลง ร่องสมองกว้างขึ้น เกิดจากการสูญเสียเนื้อเยื่อสมองตามข้อใด", options: ["Brain hypertrophy", "Brain atrophy", "Brain hyperplasia", "Brain dysplasia"], correctIndex: 1, exp: "Atrophy คือการฝ่อลีบหรือขนาดเล็กลงของเซลล์และอวัยวะอันเนื่องมาจากการลดลงของสารประกอบภายในเซลล์และจำนวนเซลล์" },
    { chName: "Cell Injury & Death", q: "18. ผู้ป่วยเป็นตับอ่อนอักเสบเฉียบพลัน (Acute pancreatitis) มีเนื้อตายแบบ Fat necrosis เกิดจากการรั่วของเอนไซม์ใด", options: ["Pepsin", "Lipase", "Amylase", "Catalase"], correctIndex: 1, exp: "Lipase ที่รั่วออกจากเซลล์ตับอ่อนจะย่อยสลายไขมันรอบตับอ่อน เกิดเป็น Fatty acids รวมกับแคลเซียมกลายเป็นคราบสบู่สีขาวชอล์ก (Fat necrosis)" },
    { chName: "Cell Injury & Death", q: "19. การอักเสบของหลอดเลือดที่มีเนื้อตายแบบ Fibrinoid necrosis มักสัมพันธ์กับความผิดปกติของระบบภูมิคุ้มกันข้อใด", options: ["การหลั่งสารฮิสตามีนจากเกล็ดเลือด", "การสะสมของ Immune complexes บริเวณผนังหลอดเลือด", "การขาดเซลล์เม็ดเลือดขาว Neutrophil", "การติดเชื้อไวรัส HIV"], correctIndex: 1, exp: "Fibrinoid necrosis เกิดจากการที่สารประกอบภูมิคุ้มกัน (Antigen-antibody complexes) ร่วมกับ Fibrin ไปเกาะตกตะกอนที่ผนังหลอดเลือด" },
    { chName: "Neoplasia & มะเร็ง", q: "20. ผู้ป่วยมีก้อนเนื้อที่ต้นแขน คลำพบขอบเขตชัดเจน ขยับได้ และโตช้า มีแนวโน้มเป็นเนื้องอกชนิดใดมากที่สุด", options: ["Invasive carcinoma", "Benign tumor (เช่น Lipoma หรือ Fibroma)", "Osteosarcoma", "Metastatic adenocarcinoma"], correctIndex: 1, exp: "Benign tumor (เนื้องอกไม่ร้ายแรง) มักมี Fibrous capsule หุ้ม ขอบเขตเรียบชัดเจน ขยับได้ และไม่รุกรานเนื้อเยื่อรอบข้าง" },
    { chName: "การอักเสบ (Inflammation)", q: "21. บาดแผลถลอกมีน้ำเหลืองใสเยิ้มซึ่งเป็นสารน้ำที่มีโปรตีนและเซลล์เม็ดเลือดขาวออกมาจากการอักเสบ เรียกว่าอะไร", options: ["Transudate", "Exudate", "Edema fluid จากไตวาย", "Chyle"], correctIndex: 1, exp: "Exudate คือสารน้ำที่รั่วออกมาจากหลอดเลือดระหว่างการอักเสบ มีความถ่วงจำเพาะสูงและมีโปรตีนรวมถึงเม็ดเลือดขาวเข้มข้น" },
    { chName: "การอักเสบ (Inflammation)", q: "22. อาการผิวหนัง แดง และ ร้อน บริเวณแผลอักเสบ เกิดขึ้นจากกลไกทางสรีรวิทยาข้อใด", options: ["การหดเกร็งของหลอดเลือดแดง", "การขยายตัวของหลอดเลือด (Vasodilation) ทำให้เลือดไหลเวียนมายังบริเวณนั้นมากขึ้น", "การแตกทำลายของต่อมเหงื่อ", "การสะสมของเม็ดสีเมลานิน"], correctIndex: 1, exp: "อาการแดง (Redness) และร้อน (Heat) เป็นผลโดยตรงจากการขยายตัวของหลอดเลือดแดง (Vasodilation) ทำให้มีปริมาณเลือดไหลผ่านเข้ามามากและรวดเร็ว" },
    { chName: "การอักเสบ (Inflammation)", q: "23. ในระยะเริ่มต้นของการอักเสบ เม็ดเลือดขาวเคลื่อนที่ผ่านผนังหลอดเลือดออกไปยังเนื้อเยื่อ เรียกว่ากระบวนการใด", options: ["Margination", "Emigration (หรือ Diapedesis)", "Phagocytosis", "Opsonization"], correctIndex: 1, exp: "Emigration (Diapedesis) คือขั้นตอนที่เม็ดเลือดขาวบีบตัวแทรกผ่านรอยต่อของเซลล์บุผนังหลอดเลือดออกไปยังเนื้อเยื่อที่มีการบาดเจ็บ" },
    { chName: "การอักเสบ (Inflammation)", q: "24. การอักเสบทำให้หลอดเลือดมี Vascular permeability เพิ่มขึ้น ส่งผลให้เกิดอาการแสดงทางคลินิกข้อใดเด่นชัด", options: ["ผิวหนังแห้งซีด", "อาการบวม (Swelling / Edema)", "กล้ามเนื้อลีบ", "กระดูกเปราะ"], correctIndex: 1, exp: "เมื่อผนังหลอดเลือดมี Permeability เพิ่มขึ้น สารน้ำและโปรตีนจะรั่วซึมเข้าสู่ Interstitial tissue ก่อให้เกิดอาการบวม (Swelling / Edema)" },
    { chName: "การอักเสบ (Inflammation)", q: "25. การติดเชื้อแบคทีเรียเฉียบพลัน เม็ดเลือดขาวชนิดใดมีบทบาทเด่นที่สุดในการทำลายเชื้อโรคในระยะแรก", options: ["Lymphocyte", "Neutrophil", "Basophil", "Eosinophil"], correctIndex: 1, exp: "Neutrophil เป็นเซลล์เม็ดเลือดขาวด่านแรกที่ตอบสนองอย่างรวดเร็วและมีจำนวนมากที่สุดในการอักเสบเฉียบพลันจากการติดเชื้อแบคทีเรีย" },
    { chName: "การอักเสบ (Inflammation)", q: "26. ผู้ป่วยติดเชื้อ Mycobacteria เป็นเวลานาน ทำให้เกิดพยาธิสภาพการอักเสบรูปแบบใด", options: ["Acute serous inflammation", "Chronic granulomatous inflammation", "Acute hemorrhagic inflammation", "Catarrhal inflammation"], correctIndex: 1, exp: "การติดเชื้อ Mycobacterium tuberculosis ทำให้เกิด Chronic granulomatous inflammation ที่มีเซลล์ Epithelioid cells, Langhans giant cells และ Caseous necrosis" },
    { chName: "การอักเสบ (Inflammation)", q: "27. ปฏิกิริยาการตอบสนองเฉพาะที่ของเนื้อเยื่อต่อการบาดเจ็บหรือการติดเชื้อเพื่อกำจัดสิ่งแปลกปลอมและซ่อมแซม เรียกว่าอะไร", options: ["Necrosis", "Inflammation (การอักเสบ)", "Apoptosis", "Metaplasia"], correctIndex: 1, exp: "Inflammation (การอักเสบ) คือกระบวนการตอบสนองของร่างกายเพื่อกำจัดสาเหตุของการบาดเจ็บและเริ่มต้นกระบวนการซ่อมแซมเนื้อเยื่อ" },
    { chName: "การอักเสบ (Inflammation)", q: "28. การอักเสบที่มีหนองสะสมอยู่ (Suppurative inflammation) มักเกิดจากการติดเชื้อจุลชีพกลุ่มใด", options: ["ไวรัสไข้หวัดใหญ่", "Pyogenic bacteria (เช่น Staphylococci)", "พยาธิใบไม้", "Prion"], correctIndex: 1, exp: "Suppurative (Purulent) inflammation เกิดจากการติดเชื้อ Pyogenic bacteria ซึ่งกระตุ้นให้มี Neutrophil จำนวนมากจนเกิดเนื้อตายแบบเหลวข้น (Pus)" },
    { chName: "ภูมิคุ้มกัน & โรคติดเชื้อ", q: "29. ผื่น บวม แดง ร้อน และคัน หลังสัมผัสสารก่อภูมิแพ้ เกิดจากการหลั่งสารใดจาก Mast cells", options: ["Histamine", "Insulin", "Albumin", "Bilirubin"], correctIndex: 0, exp: "Histamine ที่หลั่งจาก Mast cells ทำให้หลอดเลือดขยายตัว ซึมผ่านสารน้ำได้มาก และกระตุ้นปลายประสาททำให้เกิดอาการคันและบวมแดง" },
    { chName: "การอักเสบ (Inflammation)", q: "30. อาการปวดประจำเดือนเกิดจากการสร้างและหลั่งสาร Mediator ตัวใดที่ทำให้กล้ามเนื้อมดลูกบีบเกร็ง", options: ["Prostaglandins", "Histamine", "Complement C3", "Nitric oxide"], correctIndex: 0, exp: "Prostaglandins มีฤทธิ์กระตุ้นการหดรัดตัวของกล้ามเนื้อเรียบมดลูกและกระตุ้นเส้นประสาทรับความรู้สึกเจ็บปวด" },
    { chName: "Hemodynamics", q: "31. ออกกำลังกายหนัก กล้ามเนื้อน่องมีสีแดงและอุ่นขึ้นชั่วคราว การเปลี่ยนแปลงนี้เกิดจากข้อใด", options: ["Passive Congestion", "Active Hyperemia", "Venous Thrombosis", "Ischemic necrosis"], correctIndex: 1, exp: "Active Hyperemia เกิดจากการขยายตัวของหลอดเลือดแดงเพื่อส่งเลือดที่มีออกซิเจนและสารอาหารมายังกล้ามเนื้อที่กำลังทำงาน" },
    { chName: "Hemodynamics", q: "32. Renal artery thrombosis ตรวจพบเนื้อไตรูปร่างคล้ายสามเหลี่ยม/รูปลิ่มมีสีซีด เรียกว่าพยาธิสภาพใด", options: ["Red / Hemorrhagic infarct", "Pale / White infarct", "Venous congestion", "Hematoma"], correctIndex: 1, exp: "Pale (White) infarct เกิดจากการอุดตันของหลอดเลือดแดงในอวัยวะตันที่มีหลอดเลือดเลี้ยงทางเดียว เช่น ไตและหัวใจ" },
    { chName: "Hemodynamics", q: "33. ผู้ป่วยไมเกรนที่ใช้ยา Ergotamine มากเกินไป มีอาการเท้าเขียวคล้ำและปวดรุนแรง กลไกเริ่มต้นจากข้อใด", options: ["หลอดเลือดดำอุดตันจากพยาธิ", "Severe arterial vasoconstriction (หลอดเลือดแดงหดตัวรุนแรง)", "การขาดวิตามินซี", "เกล็ดเลือดต่ำเฉียบพลัน"], correctIndex: 1, exp: "Ergotamine ออกฤทธิ์ทำให้หลอดเลือดแดงหดเกร็งตัวอย่างรุนแรง (Arterial vasoconstriction) จนเนื้อเยื่อส่วนปลายขาดเลือด (Ischemia) และเกิดเนื้อตาย" },
    { chName: "Hemodynamics", q: "34. ผู้ป่วยบาดเจ็บกล้ามเนื้อรุนแรง (Rhabdomyolysis) มีปัสสาวะสีน้ำตาลเข้ม เกิดจากกลไกข้อใด", options: ["การหลั่ง Bilirubin สู่กระแสเลือด", "Myoglobin รั่วจากกล้ามเนื้อเข้าสู่กระแสเลือดและกรองไปอุดตันท่อไต", "การติดเชื้อไวรัสตับอักเสบ", "การขาดโปรตีนในเลือด"], correctIndex: 1, exp: "Rhabdomyolysis ทำให้ Myoglobin จากกล้ามเนื้อที่สลายตัวรั่วเข้าสู่กระแสเลือด กรองผ่านไตและตกตะกอนอุดตันท่อไต ทำให้ปัสสาวะมีสีน้ำตาลเข้ม" },
    { chName: "Hemodynamics", q: "35. นั่งเครื่องบินระยะยาวแล้วมีอาการปวดบวมที่ขาข้างเดียว คล้ายเส้นเลือดขอด พยาธิสภาพนี้นึกถึงโรคใด", options: ["Deep Vein Thrombosis (DVT)", "Arterial embolism", "Gas gangrene", "Elephantiasis"], correctIndex: 0, exp: "การนั่งนิ่งเป็นเวลานานทำให้เกิด Stasis of blood flow ในหลอดเลือดดำส่วนลึกของขา นำไปสู่ภาวะ Deep Vein Thrombosis (DVT)" },
    { chName: "Hemodynamics", q: "36. ผู้ป่วยไอออกมาเป็นเลือดสดจากระบบทางเดินหายใจ เรียกว่าอาการใด", options: ["Hematemesis", "Hemoptysis", "Melena", "Hematuria"], correctIndex: 1, exp: "Hemoptysis คือการไอเป็นเลือดสดจากทางเดินหายใจ ส่วน Hematemesis คือการอาเจียนเป็นเลือดจากทางเดินอาหาร" },
    { chName: "สิ่งแวดล้อมและโภชนาการ", q: "37. ผู้ป่วยแผลไฟไหม้บริเวณกว้างที่มีอาการปวดบวมอย่างรวดเร็ว ควรระวังภาวะแทรกซ้อนอันตรายใดมากที่สุด", options: ["Hypovolemic shock จากการสูญเสียสารน้ำออกนอกหลอดเลือด", "ความดันโลหิตสูงเฉียบพลัน", "ภาวะเลือดข้นเกินไปจนแข็งตัวไม่ได้", "ตับวายจากสารพิษ"], correctIndex: 0, exp: "แผลไฟไหม้รุนแรงจะทำให้หลอดเลือดซึมผ่านสารน้ำออกสู่ Interstitium มหาศาล เกิดภาวะ Hypovolemic shock ที่อันตรายถึงชีวิต" },
    { chName: "Hemodynamics", q: "38. รอยฟกช้ำที่เปลี่ยนเป็นสีเหลืองหรือสีน้ำตาลทอง เกิดจากการสะสมของสารใด", options: ["Hemoglobin", "Bilirubin และ Hemosiderin", "Biliverdin", "Melanin"], correctIndex: 1, exp: "การสลายตัวของเม็ดเลือดแดงในรอยช้ำระยะท้ายจะเปลี่ยน Biliverdin ไปเป็น Bilirubin และ Hemosiderin ซึ่งให้สีเหลืองและน้ำตาลทอง" },
    { chName: "Hemodynamics", q: "39. อาการบวมบุ๋มทั้งสองข้าง (Pitting edema) ในผู้ป่วยโรคตับ เกิดจากกลไกข้อใด", options: ["Increased oncotic pressure", "Decreased plasma oncotic pressure จากภาวะ Hypoalbuminemia", "Lymphatic obstruction", "Arterial spasm"], correctIndex: 1, exp: "ตับที่เสื่อมสภาพสร้าง Albumin ได้ลดลง ทำให้แรงดึงน้ำในหลอดเลือด (Plasma oncotic pressure) ลดลง สารน้ำจึงรั่วออกสู่เนื้อเยื่อเกิดบวมบุ๋ม" },
    { chName: "Neoplasia & มะเร็ง", q: "40. คำว่า 'Anaplasia' ในทางพยาธิวิทยามะเร็ง หมายถึงข้อใด", options: ["การเปลี่ยนแปลงชนิดของเซลล์แบบกลับคืนได้", "การสูญเสียการเปลี่ยนแปลงสัณฐานและการทำหน้าที่ของเซลล์อย่างสิ้นเชิง (Lack of differentiation)", "การที่เซลล์มีขนาดเท่ากันทุกเซลล์", "การตายของเซลล์แบบ Apoptosis"], correctIndex: 1, exp: "Anaplasia คือลักษณะของเซลล์มะเร็งชั้นสูงที่สูญเสีย Differentiation โดยสิ้นเชิง เซลล์มีรูปร่างผิดเพี้ยนไปจนไม่สามารถบอกเซลล์ต้นกำเนิดได้" },
    { chName: "Neoplasia & มะเร็ง", q: "41. กลไกของเชื้อไวรัส HPV ที่ทำให้เกิดมะเร็งปากมดลูก เกิดจากการทำงานของโปรตีนใด", options: ["E6 ยับยั้ง p53 และ E7 ยับยั้ง RB tumor suppressor proteins", "E6 ยับยั้ง RB และ E7 ยับยั้ง p53", "สร้างสารพิษทำลายดีเอ็นเอโดยตรง", "ยับยั้งเอนไซม์ Cytochrome P450"], correctIndex: 0, exp: "Oncoprotein E6 ของ HPV เข้าจับทำลาย p53 และ E7 เข้าจับยับยั้ง RB ทำให้เซลล์แบ่งตัวอย่างผิดปกติโดยไม่มีการควบคุม" },
    { chName: "Neoplasia & มะเร็ง", q: "42. ผู้ป่วยโรค Xeroderma pigmentosum เสี่ยงต่อการเป็นมะเร็งผิวหนังจากแสงแดด เนื่องจากระบบซ่อมแซม DNA ใดบกพร่อง", options: ["Mismatch repair system", "Nucleotide excision repair pathway (ไม่สามารถซ่อม Pyrimidine dimers ได้)", "Base excision repair", "Homologous end joining"], correctIndex: 1, exp: "Xeroderma pigmentosum มีความบกพร่องของ Nucleotide excision repair ทำให้เซลล์ไม่สามารถซ่อมแซม Pyrimidine dimers ที่เกิดจากรังสี UV ได้" },
    { chName: "Neoplasia & มะเร็ง", q: "43. เซลล์เนื้องอกที่มีขนาด รูปร่างแตกต่างกันหลากหลาย และนิวเคลียสติดสีเข้มจัด เรียกลักษณะดังกล่าวว่าอะไร", options: ["Hyperplasia และ Atrophy", "Pleomorphism และ Nuclear hyperchromatism", "Metaplasia และ Steatosis", "Karyolysis"], correctIndex: 1, exp: "Pleomorphism คือความหลากหลายของขนาดและรูปร่างเซลล์ ส่วน Hyperchromatism คือนิวเคลียสติดสีเข้มจากปริมาณ DNA ที่เพิ่มขึ้น" },
    { chName: "สิ่งแวดล้อมและโภชนาการ", q: "44. ผู้ป่วยมีอาการน้ำลายไหล รูม่านตาหด หัวใจเต้นช้า และกล้ามเนื้อกระตุกหลังฉีดยาฆ่าแมลง กลไกสำคัญเกิดจากข้อใด", options: ["Organophosphate ยับยั้งเอนไซม์ Acetylcholinesterase ทำให้ Acetylcholine คั่ง", "สารตะกั่วทำลายไขกระดูก", "การขาดออกซิเจนในเม็ดเลือดแดง", "เซลล์ตับถูกทำลายด้วย NAPQI"], correctIndex: 0, exp: "Organophosphate ยับยั้งเอนไซม์ AChE ส่งผลให้เกิดการกระตุ้นตัวรับ Muscarinic และ Nicotinic มากเกินไป (SLUDGE syndrome)" },

    { chName: "สิ่งแวดล้อมและโภชนาการ", q: "46. ยาพาราเซตามอลก่อพิษต่อตับผ่านสารตัวกลางชนิดใดเมื่อเกิดภาวะ Glutathione หมดไป", options: ["Acetaldehyde", "NAPQI (N-acetyl-p-benzoquinone imine)", "Formaldehyde", "Carbon monoxide"], correctIndex: 1, exp: "NAPQI เป็นสารพิษตัวกลางที่เกิดจากการเผาผลาญพาราเซตามอล เมื่อ Glutathione หมดจะทำให้เซลล์ตับเกิด Necrosis" },

    { chName: "บทนำพยาธิวิทยา", q: "48. แหล่งสะสมหลักของไขมันในร่างกายที่มักพบการเปลี่ยนแปลงแบบ Fatty change เมื่อเกิดการบาดเจ็บคืออวัยวะใด", options: ["สมอง", "ตับ (Liver)", "ไต", "ม้าม"], correctIndex: 1, exp: "ตับเป็นอวัยวะหลักในการเผาผลาญไขมัน เมื่อเซลล์ตับบาดเจ็บจะพบการสะสมของหยดไขมัน (Fatty change / Steatosis) ได้ชัดเจนที่สุด" },
    { chName: "สิ่งแวดล้อมและโภชนาการ", q: "49. นักวิ่งหมดสติกลางแดด อุณหภูมิกาย 41.2°C กลไกหลักของ Heat stroke ในระดับเซลล์คือข้อใด", options: ["Protein denaturation และ Vascular endothelial damage", "การสะสมของสารตะกั่ว", "ขาดวิตามินเอ", "ภาวะเม็ดเลือดขาวต่ำ"], correctIndex: 0, exp: "ความร้อนที่สูงเกิน 40°C ทำให้โปรตีนในเซลล์เสียสภาพ (Protein denaturation), เซลล์เยื่อบุหลอดเลือดเสียหาย และเกิด Multi-organ dysfunction" },
    { chName: "สิ่งแวดล้อมและโภชนาการ", q: "50. เด็กที่ขาดสารอาหารโปรตีนอย่างรุนแรงแต่ได้คาร์โบไฮเดรต มีอาการบวมน้ำ ท้องป่อง และตับโต คือโรคใด", options: ["Marasmus", "Kwashiorkor", "Scurvy", "Rickets"], correctIndex: 1, exp: "Kwashiorkor เป็นโรคขาดโปรตีน ทำให้ระดับ Albumin ต่ำ เกิดอาการบวมน้ำ ท้องป่อง และ Fatty liver" },
    { chName: "สิ่งแวดล้อมและโภชนาการ", q: "51. หญิงที่วางแผนตั้งครรภ์ควรรับประทานวิตามินใดเพื่อป้องกันความพิการแต่กำเนิดทางระบบประสาท (Neural tube defects)", options: ["Vitamin A", "Folic acid (Vitamin B9)", "Vitamin C", "Vitamin D"], correctIndex: 1, exp: "Folic acid (Vitamin B9) มีความสำคัญต่อการสร้างหลอดประสาทของตัวอ่อนในครรภ์ ช่วยป้องกันภาวะ Neural tube defects" },
    { chName: "สิ่งแวดล้อมและโภชนาการ", q: "52. ทารกที่มีกลุ่มอาการ Fetal Alcohol Syndrome (FAS) มักมีลักษณะทางกายภาพตามข้อใด", options: ["ศีรษะเล็ก (Microcephaly), ร่องเหนือริมฝีปากบนเรียบ (Smooth philtrum) และริมฝีปากบนบาง", "ศีรษะโตผิดปกติ ตาโปน", "กรามใหญ่ ฟันซ้อนเก", "แขนขายาวเกินปกติ"], correctIndex: 0, exp: "FAS มีลักษณะเด่นคือ Microcephaly, Small palpebral fissures, Smooth philtrum และ Thin upper lip" },
    { chName: "ภูมิคุ้มกัน & โรคติดเชื้อ", q: "53. เซลล์ชนิดใดในระบบภูมิคุ้มกันที่ทำหน้าที่สร้างและหลั่งแอนติบอดีเพื่อจับกับเชื้อโรค", options: ["T-helper cell", "Plasma cell (พัฒนามาจาก B cell)", "Neutrophil", "Macrophage"], correctIndex: 1, exp: "B lymphocyte เมื่อได้รับการกระตุ้นจากแอนติเจนจะพัฒนาเป็น Plasma cell เพื่อสร้างและหลั่งแอนติบอดี (Immunoglobulins)" },
    { chName: "ภูมิคุ้มกัน & โรคติดเชื้อ", q: "54. การทดสอบ PPD (Tuberculin skin test) สำหรับวัณโรค เกิดจากปฏิกิริยาของเซลล์ชนิดใด", options: ["IgE และ Basophils", "CD4+ T cells และ Macrophages (Type IV Hypersensitivity)", "เกล็ดเลือด", "B cells สร้างแอนติบอดีทำลายทันที"], correctIndex: 1, exp: "PPD test เป็น Delayed-type hypersensitivity (Type IV) ที่อาศัยการทำงานของ Sensitized CD4+ T cells และ Macrophages" },
    { chName: "ภูมิคุ้มกัน & โรคติดเชื้อ", q: "55. ผู้ป่วยแพ้ถั่วลิสง รับประทานแล้ว 15 นาทีเกิดผื่น ผิวหนังแดง หายใจลำบาก จัดเป็นภูมิไวเกินชนิดใด", options: ["Type I Hypersensitivity (Immediate / Anaphylaxis)", "Type II Hypersensitivity", "Type III Hypersensitivity", "Type IV Hypersensitivity"], correctIndex: 0, exp: "การแพ้อาหารเฉียบพลันเกิดจากแอนติบอดี IgE บนผิว Mast cell ทำให้หลั่ง Histamine ภายในไม่กี่นาที จัดเป็น Type I Hypersensitivity" },
    { chName: "ภูมิคุ้มกัน & โรคติดเชื้อ", q: "56. ผู้ป่วยโรค AIHA มีแอนติบอดีจับกับแอนติเจนบนเม็ดเลือดแดงทำให้เม็ดเลือดแดงแตก จัดเป็น Hypersensitivity ชนิดใด", options: ["Type I", "Type II (Antibody-mediated hypersensitivity)", "Type III", "Type IV"], correctIndex: 1, exp: "Type II Hypersensitivity เกิดจากแอนติบอดี (IgG หรือ IgM) เข้าจับกับแอนติเจนบนผิวเซลล์เป้าหมายโดยตรงและกระตุ้นการทำลายเซลล์" },
    { chName: "ภูมิคุ้มกัน & โรคติดเชื้อ", q: "57. อาการไข้ ปวดสีข้าง และปัสสาวะสีแดงหลังการให้เลือดผิดหมู่ เกิดจากกลไกข้อใด", options: ["Transfusion reaction โดยแอนติบอดีทำลายเม็ดเลือดแดงแตกในหลอดเลือดและเกิด Hemoglobinuria", "การติดเชื้อแบคทีเรียในกระเพาะปัสสาวะ", "การขาดน้ำอย่างรุนแรง", "เกล็ดเลือดทำงานผิดปกติ"], correctIndex: 0, exp: "การให้เลือดผิดหมู่ (ABO incompatibility) ทำให้เกิดปฏิกิริยา Type II Hypersensitivity เม็ดเลือดแดงแตกเฉียบพลัน ปล่อย Hemoglobin ออกมาในปัสสาวะและกระตุ้นการอักเสบทั่วร่างกาย" },

let currentSetKey = 'set2';
let activeQuestions = [];
let userResponses = [];
let totalScore = 0;

// ฟังก์ชันสลับ Array แบบ Fisher-Yates
function shuffle(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

// เตรียมชุดคำถามและสลับช้อยส์
function prepareQuestions(rawList) {
    return rawList.map(item => {
        const originalOptions = item.options.map((opt, idx) => ({
            text: opt,
            isCorrect: (idx === item.correctIndex)
        }));
        
        // สุ่มสลับตัวเลือก
        const shuffledOptions = shuffle([...originalOptions]);
        const newCorrectIndex = shuffledOptions.findIndex(o => o.isCorrect);

        return {
            chName: item.chName,
            q: item.q,
            options: shuffledOptions.map(o => o.text),
            ans: newCorrectIndex,
            exp: item.exp
        };
    });
}

function initExam(setKey) {
    currentSetKey = setKey;
    const rawData = (setKey === 'set2') ? rawSet2 : rawSet1;
    
    // สุ่มสลับตัวเลือกของทุกข้อ
    activeQuestions = prepareQuestions(rawData);
    userResponses = new Array(activeQuestions.length).fill(null);
    totalScore = 0;

    document.getElementById('total-q-count').innerText = activeQuestions.length;
    document.getElementById('finish-btn').style.display = 'block';
    document.getElementById('summary-card').style.display = 'none';

    renderQuestions();
    refreshStats();
}

function renderQuestions() {
    const listContainer = document.getElementById('questions-list');
    listContainer.innerHTML = '';

    activeQuestions.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${index}`;

        const header = document.createElement('div');
        header.className = 'card-header';
        header.innerHTML = `
            <span class="chapter-badge">${item.chName}</span>
            <span class="q-index">ข้อที่ ${index + 1} / ${activeQuestions.length}</span>
        `;

        const title = document.createElement('div');
        title.className = 'q-title';
        title.innerText = item.q;

        const grid = document.createElement('div');
        grid.className = 'options-grid';

        item.options.forEach((optText, optIdx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.id = `btn-${index}-${optIdx}`;
            btn.innerText = `${String.fromCharCode(65 + optIdx)}. ${optText}`;
            btn.onclick = () => handleSelection(index, optIdx);

            if (userResponses[index] !== null) {
                btn.disabled = true;
                if (optIdx === item.ans) btn.classList.add('correct');
                else if (optIdx === userResponses[index]) btn.classList.add('wrong');
            }

            grid.appendChild(btn);
        });

        const exp = document.createElement('div');
        exp.className = `explanation-box ${userResponses[index] !== null ? 'show' : ''}`;
        exp.id = `exp-${index}`;
        exp.innerHTML = `<strong>💡 คำอธิบายเฉลย:</strong> ${item.exp}`;

        card.appendChild(header);
        card.appendChild(title);
        card.appendChild(grid);
        card.appendChild(exp);

        listContainer.appendChild(card);
    });
}

function handleSelection(qIdx, selectedOpt) {
    if (userResponses[qIdx] !== null) return;

    userResponses[qIdx] = selectedOpt;
    const qData = activeQuestions[qIdx];
    const isCorrect = (selectedOpt === qData.ans);

    if (isCorrect) totalScore++;

    for (let i = 0; i < qData.options.length; i++) {
        const btn = document.getElementById(`btn-${qIdx}-${i}`);
        btn.disabled = true;
        if (i === qData.ans) {
            btn.classList.add('correct');
        } else if (i === selectedOpt && !isCorrect) {
            btn.classList.add('wrong');
        }
    }

    document.getElementById(`exp-${qIdx}`).classList.add('show');
    refreshStats();
}

function refreshStats() {
    const answeredCount = userResponses.filter(r => r !== null).length;
    document.getElementById('ans-count').innerText = answeredCount;
    document.getElementById('score-count').innerText = totalScore;
    document.getElementById('progress-fill').style.width = `${(answeredCount / activeQuestions.length) * 100}%`;
}

function switchSet(setKey) {
    document.querySelectorAll('.set-btn').forEach(btn => btn.classList.remove('active'));
    if (setKey === 'set2') document.getElementById('btn-set-2').classList.add('active');
    else document.getElementById('btn-set-1').classList.add('active');

    initExam(setKey);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartCurrentSet() {
    initExam(currentSetKey);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function filterSet(key, btnElement) {
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');

    if (key === 'set1') {
        switchSet('set1');
    } else if (key === 'set2') {
        switchSet('set2');
    } else {
        activeQuestions.forEach((item, index) => {
            const card = document.getElementById(`card-${index}`);
            let show = false;
            if (key === 'all') show = true;
            else if (key === 'ch1' && item.chName.includes("บทนำ")) show = true;
            else if (key === 'ch2' && item.chName.includes("การอักเสบ")) show = true;
            else if (key === 'ch3' && item.chName.includes("Hemodynamics")) show = true;
            else if (key === 'ch4' && item.chName.includes("Cell Injury")) show = true;
            else if (key === 'ch5' && item.chName.includes("Neoplasia")) show = true;
            else if (key === 'ch6' && item.chName.includes("สิ่งแวดล้อม")) show = true;
            else if (key === 'ch7' && item.chName.includes("ภูมิคุ้มกัน")) show = true;
            
            card.style.display = show ? 'block' : 'none';
        });
    }
}

function submitExam() {
    const total = activeQuestions.length;
    const answered = userResponses.filter(r => r !== null).length;
    if (answered < total) {
        if (!confirm(`คุณทำข้อสอบไปแล้ว ${answered}/${total} ข้อ ต้องการส่งข้อสอบและดูสรุปคะแนนเลยหรือไม่?`)) {
            return;
        }
    }

    const wrongCount = answered - totalScore;
    const pct = Math.round((totalScore / total) * 100);

    document.getElementById('finish-btn').style.display = 'none';
    const summary = document.getElementById('summary-card');
    summary.style.display = 'block';

    document.getElementById('summary-title').innerText = (currentSetKey === 'set2') 
        ? "🎉 สรุปผล: ชุดที่ 2 (แนวข้อสอบ 60 ข้อ)" 
        : "🎉 สรุปผล: ชุดที่ 1 (คลังข้อสอบ 100 ข้อ)";

    document.getElementById('sum-correct').innerText = `${totalScore} ข้อ`;
    document.getElementById('sum-wrong').innerText = `${wrongCount} ข้อ`;
    document.getElementById('sum-total').innerText = `${pct}%`;

    let feedback = "";
    if (pct >= 80) feedback = "ยอดเยี่ยมมากครับ! คุณมีความรู้ความเข้าใจในวิชาพยาธิวิทยาเป็นอย่างดี พร้อมสอบจริงได้คะแนนสูงแน่นอนครับ";
    else if (pct >= 60) feedback = "ผ่านเกณฑ์ระดับดีครับ! ลองกดปุ่มเริ่มใหม่เพื่อสุ่มช้อยส์ฝึกทำซ้ำจนคล่องแคล่ว 100% ครับ";
    else feedback = "แนะนำให้ทบทวนข้อที่ตอบผิดอีกครั้ง แล้วลองสุ่มทำใหม่เพื่อเพิ่มความแม่นยำนะครับ สู้ๆ ครับ!";

    document.getElementById('feedback-text').innerText = feedback;
    summary.scrollIntoView({ behavior: 'smooth' });
}

// เริ่มต้นโหลดชุดที่ 2 (60 ข้อ) ทันที
window.onload = () => {
    initExam('set2');
};
